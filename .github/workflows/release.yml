name: Release

# Pushing a version tag (v0.1.0) builds the package, publishes it to PyPI
# once a maintainer approves the pypi environment, and then creates a GitHub
# release whose notes are that version's section of CHANGELOG.md and updates
# the MCP Registry listing (com.deployangel/deployangel) to the new version.
#
# PyPI trusts this workflow directly (trusted publishing), so there's no API
# token anywhere: PyPI's publisher for the deployangel project names this
# repository, release.yml, and the pypi environment.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check the tag, version, and CHANGELOG agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' src/deployangel/version.py)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match version $version in src/deployangel/version.py."
            exit 1
          fi
          if ! grep -q "^## $version " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deployangel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists."
            exit 0
          fi

          # The lines under "## <version> (date)", up to the next heading,
          # without leading or trailing blank lines.
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] == "") first++
              last = n;  while (last >= first && lines[last] == "") last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' CHANGELOG.md > notes.md

          gh release create "$TAG" dist/* --title "deployangel (Python) $version" --notes-file notes.md

  # The MCP Registry lists the MCP server by the PyPI version it installs, and
  # checks that version's README carries the listing's name. Logging in with
  # deployangel.com's key (the DNS record "v=MCPv1; k=ed25519; ...") is what
  # allows publishing under com.deployangel.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set the version in server.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          jq --arg v "$version" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Wait for PyPI to serve the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/deployangel/$version/json" | grep -q "mcp-name: com.deployangel/deployangel"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::PyPI doesn't serve deployangel $version with the registry name in its README yet."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::error::The MCP_PRIVATE_KEY secret isn't set, so the MCP Registry listing wasn't updated."
            exit 1
          fi
          ./mcp-publisher login dns --domain deployangel.com --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
